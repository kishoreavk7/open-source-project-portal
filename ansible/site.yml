---
# =========================================================================
# Main Ansible Playbook - Open Source Project Portal
# Orchestrates server provisioning across master and worker nodes
# =========================================================================

- name: Configure all Kubernetes cluster nodes (prerequisites and container runtime)
  hosts: k8s_cluster
  become: yes
  roles:
    - common
    - docker
    - kubernetes

- name: Master node post-configuration verification
  hosts: master
  become: yes
  tasks:
    - name: Verify Docker is active
      ansible.builtin.systemd:
        name: docker
        state: started

    - name: Verify Containerd is active
      ansible.builtin.systemd:
        name: containerd
        state: started

    - name: Check Kubelet status
      ansible.builtin.command: systemctl status kubelet
      register: kubelet_status
      failed_when: false
      changed_when: false

    - name: Output Kubelet status summary
      ansible.builtin.debug:
        msg: "Kubelet service is configured and ready for cluster initialization."
