# =========================================================================
# Kubernetes Service - Open Source Project Portal
# Internal ClusterIP service exposing Spring Boot pods on port 8080
# =========================================================================

apiVersion: v1
kind: Service
metadata:
  name: open-source-portal-service
  namespace: open-source-portal
  labels:
    app: open-source-project-portal
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: open-source-project-portal
