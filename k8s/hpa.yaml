# =========================================================================
# Kubernetes Horizontal Pod Autoscaler (HPA) - Open Source Project Portal
# Automatically scales pod replicas between 2 and 5 based on CPU utilization
# =========================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: open-source-portal-hpa
  namespace: open-source-portal
  labels:
    app: open-source-project-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: open-source-project-portal
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
